name: "BoekAssist — regietaak"
description: "Compacte intake voor ontwikkeling onder Regieagent v1 (geen automatische merge of productieacties)"
title: "[Regie] "
body:
  - type: markdown
    attributes:
      value: |
        Deze intake volgt `docs/REGIEAGENT_V1.md`. Vermeld geen geheimen of persoonsgegevens.
        Begin altijd met `AGENTS.md` en `PROJECT_MAP.md`; een Issue verleent geen merge- of productie-GO.
  - type: textarea
    id: doel
    attributes:
      label: Doel
      description: "Wat moet er aantoonbaar beter zijn?"
      placeholder: "Huidig probleem en gewenst resultaat in 1-2 zinnen"
    validations:
      required: true
  - type: dropdown
    id: risico
    attributes:
      label: Risicoklasse
      description: "Bij twijfel H kiezen; regie verifieert de inschatting"
      options:
        - "L — documentatie, kleine UI of mechanische cleanup"
        - "M — applicatiegedrag, integraties of tests"
        - "H — geldboekingen, RLS/auth, schema, data of productie"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope en grenzen
      description: "Bestanden, modules en expliciete uitsluitingen"
      placeholder: "Alleen ...; niet wijzigen: ..."
    validations:
      required: true
  - type: textarea
    id: afhankelijkheden
    attributes:
      label: Afhankelijkheden en exclusief file-eigenaarschap
      description: "Vermeld open PR's, migraties, vereiste reviews en andere agents die dezelfde bestanden bezitten; vul expliciet 'geen' in als er niets speelt"
      placeholder: "PR's: geen; migraties: geen; review: geen; exclusieve bestanden/eigenaar: geen"
    validations:
      required: true
  - type: textarea
    id: acceptatie
    attributes:
      label: Acceptatiecriteria
      description: "Concreet toetsbare uitkomsten en regressiecontroles"
      placeholder: "Gedrag X werkt; bestaande Y blijft werken; typecheck, lint, tests, build"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / links (optioneel)
      description: "Extra links, bekende risico's en relevante documentatie"
    validations:
      required: false
