name: Typecheck, lint, tests & build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history for branch-scope tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests (offline, no production credentials)
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-inert-not-a-real-supabase-key
          VITE_SUPABASE_ANON_KEY: ci-inert-not-a-real-supabase-key
        run: |
          # Remove committed environment files only from the ephemeral runner checkout.
          # The dummy URL and key allow mocked modules to initialize without production access.
          rm -f .env .env.local .env.test .env.test.local
          npm run test -- --exclude src/test/security-backup-and-storage-access.test.ts
          # This file contains optional LIVE HTTP tests; keep its valuable static assertions,
          # but prevent the live suite from enabling by emptying the key for this invocation.
          VITE_SUPABASE_PUBLISHABLE_KEY= VITE_SUPABASE_ANON_KEY= npx vitest run src/test/security-backup-and-storage-access.test.ts

      - name: Production build
        run: npm run build
