name: Typecheck, lint, tests & build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-ci-${{ github.workflow }}-${{ github.ref }}
  # Only a superseded PR run is cancelled; every push to main gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history for branch-scope tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # tsconfig.json only holds references ("files": []), so this checks no files
      # itself; the two typechecks below cover src/ and vite.config.ts.
      - name: Typecheck (root references)
        run: npx tsc --noEmit

      - name: Application typecheck
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Node config typecheck (vite.config.ts)
        run: npx tsc -p tsconfig.node.json --noEmit

      # Ratchet: the warning count may not grow beyond today's 20 (lower it as warnings are fixed).
      - name: Lint
        run: npm run lint -- --max-warnings 20

      - name: Unit and contract tests (offline, no production credentials)
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-inert-not-a-real-supabase-key
          VITE_SUPABASE_ANON_KEY: ci-inert-not-a-real-supabase-key
        run: |
          # Quarantine .env files only inside this ephemeral checkout during tests.
          # Restore them on all exits so the subsequent Vite build gets its normal config.
          restore_dotenv() {
            for envfile in .env .env.local .env.test .env.test.local; do
              if [ -f "${envfile}.ci-quarantined" ]; then mv "${envfile}.ci-quarantined" "$envfile"; fi
            done
          }
          trap restore_dotenv EXIT
          for envfile in .env .env.local .env.test .env.test.local; do
            if [ -f "$envfile" ]; then mv "$envfile" "${envfile}.ci-quarantined"; fi
          done
          # vitest.config.ts makes the Supabase env inert for every test and
          # src/test/setup.ts blocks non-loopback network; the live security layer
          # only runs with BOEKASSIST_LIVE_SECURITY_TESTS=1, which CI never sets.
          # CI runners can be slower: allow 15s for existing async UI tests without changing their assertions.
          npm run test -- --testTimeout=15000

      - name: Production build
        run: npm run build

  db-proofs:
    name: Database proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Throwaway server for supabase/tests/*/run-proof.sh only. The C.UTF-8
        # locale matches the local proof clusters the harnesses were written on.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
        # The harnesses' dblink sessions connect from inside the container to
        # 127.0.0.1:$PGPORT (loopback is "trust" in this image), so the
        # container port must equal the published port.
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --shm-size 256m
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout full history (bank-release-hold-history reads git show 3669a94:…)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-client
          fi
          psql --version

      - name: Run every supabase/tests/*/run-proof.sh
        env:
          DB_PROOFS_LOG_DIR: ${{ runner.temp }}/db-proofs
        run: bash scripts/ci/run-db-proofs.sh
