name: BoekAssist Regieagent v2 — read-only snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read

jobs:
  snapshot:
    name: GitHub PR & Issue overview (no writes)
    if: github.repository == 'Spiderman010/speedy-admin-automate-80194267'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reporting code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generate bounded read-only summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/regieagent-report.mjs
