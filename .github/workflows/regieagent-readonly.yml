name: BoekAssist Regieagent v2 — read-only snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: read
  statuses: read

jobs:
  snapshot:
    name: GitHub PR & Issue overview (no writes)
    if: github.repository == 'Spiderman010/speedy-admin-automate-80194267'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Generate bounded read-only summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/regieagent-report.mjs
